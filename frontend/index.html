<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>MCAddonCompanion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.addEventListener('error', e => { document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;bottom:0;left:0;right:0;color:red;background:#111;padding:10px;font-size:11px;z-index:9999;white-space:pre-wrap">' + e.message + ' @ ' + e.filename + ':' + e.lineno + '</pre>') })
    window.addEventListener('unhandledrejection', e => { document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;bottom:0;left:0;right:0;color:orange;background:#111;padding:10px;font-size:11px;z-index:9999;white-space:pre-wrap">Rejection: ' + (e.reason?.stack||e.reason) + '</pre>') })
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
