<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>MCAddonCompanion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.addEventListener('error', e => { document.body.innerHTML = '<pre style="color:red;padding:20px;white-space:pre-wrap">' + e.message + '\n' + (e.filename||'') + ':' + e.lineno + '\n' + (e.error?.stack||'') + '</pre>' })
    window.addEventListener('unhandledrejection', e => { document.body.innerHTML = '<pre style="color:orange;padding:20px;white-space:pre-wrap">Unhandled rejection:\n' + (e.reason?.stack || e.reason) + '</pre>' })
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
