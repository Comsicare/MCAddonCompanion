workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: never

stages:
  - build
  - release

# -----------------------------------------------------------------------
# Linux build — native Python on Debian slim
# -----------------------------------------------------------------------
build_linux:
  stage: build
  image: python:3.11-slim-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git binutils libwebkit2gtk-4.1-dev python3-gi gir1.2-webkit2-4.1 libgtk-3-dev
    - pip install --upgrade pip --quiet
    - pip install pyinstaller pywebview --quiet
    - echo "BUILD_SHA = '${CI_COMMIT_SHA}'" > core/_build_info.py
  script:
    - pyinstaller MCAddonCompanion.spec --clean --distpath dist_linux
    - ls -lh dist_linux/MCAddonCompanion/
  artifacts:
    name: "linux-${CI_COMMIT_SHORT_SHA}"
    expire_in: 7 days
    paths:
      - dist_linux/MCAddonCompanion/

# -----------------------------------------------------------------------
# Release jobs — conditional on tag format
# GitHub Actions handles the Windows build and uploads MCAddonCompanion-Windows.exe
# -----------------------------------------------------------------------

.release_common:
  stage: release
  image: alpine:3.19
  needs:
    - job: build_linux
      artifacts: true
  before_script:
    - apk add --no-cache curl jq bash tar gzip
  script:
    - |
      API="https://api.github.com/repos/Comsicare/MCAddonCompanion"
      # Wait up to 10 minutes for GitHub Actions to create the release
      for i in $(seq 1 30); do
        RELEASE=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "${API}/releases/tags/${CI_COMMIT_TAG}")
        UPLOAD_URL=$(echo "$RELEASE" | jq -r '.upload_url // ""' | sed 's/{?name,label}//')
        if [ -n "$UPLOAD_URL" ] && [ "$UPLOAD_URL" != "null" ]; then
          echo "Release found at iteration $i"
          break
        fi
        echo "Waiting for GitHub Actions to create release... ($i/30)"
        sleep 20
      done
      if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
        echo "ERROR: Release not found after 10 minutes"
        exit 1
      fi
      # Package Linux build as tar.gz and upload
      tar -czf MCAddonCompanion-Linux.tar.gz -C dist_linux MCAddonCompanion
      curl -sf -X POST \
        -H "Authorization: token ${GITHUB_TOKEN}" \
        -H "Content-Type: application/gzip" \
        --data-binary @MCAddonCompanion-Linux.tar.gz \
        "${UPLOAD_URL}?name=MCAddonCompanion-Linux.tar.gz"
      echo "Uploaded Linux archive"

release_alpha:
  extends: .release_common
  variables:
    RELEASE_TITLE: "${CI_COMMIT_TAG} Alpha"
    RELEASE_PRERELEASE: "true"
    RELEASE_NOTES: "**Alpha build** — early testing only, expect bugs. Update stream: alpha"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-alpha$/

release_beta:
  extends: .release_common
  variables:
    RELEASE_TITLE: "${CI_COMMIT_TAG} Beta"
    RELEASE_PRERELEASE: "true"
    RELEASE_NOTES: "**Beta build** — wider testing, mostly stable. Update stream: beta"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-beta$/

release_rc:
  extends: .release_common
  variables:
    RELEASE_TITLE: "${CI_COMMIT_TAG} Release Candidate"
    RELEASE_PRERELEASE: "true"
    RELEASE_NOTES: "**Release candidate** — feature complete, final testing. Update stream: prerelease"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\d*$/

release_stable:
  extends: .release_common
  variables:
    RELEASE_TITLE: "${CI_COMMIT_TAG}"
    RELEASE_PRERELEASE: "false"
    RELEASE_NOTES: "Stable release ${CI_COMMIT_TAG}."
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
