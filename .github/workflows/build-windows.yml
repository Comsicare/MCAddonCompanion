name: Build Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller MCAddonCompanion.spec --clean --distpath dist_windows

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh

      - name: Create GitHub Release and upload installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Determine prerelease flag
          PRERELEASE_FLAG="--prerelease"
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            PRERELEASE_FLAG=""
          fi

          # Write commit notes to file to avoid quoting issues
          git log -1 --format="%B" > release_notes.txt

          # Create release if it doesn't exist, then upload asset
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release already exists, uploading asset..."
            gh release upload "$TAG" Output/MCAddonCompanion-Setup.exe --clobber
          else
            echo "Creating release..."
            gh release create "$TAG" \
              Output/MCAddonCompanion-Setup.exe \
              --title "$TAG" \
              --notes-file release_notes.txt \
              $PRERELEASE_FLAG
          fi
          echo "Done"
